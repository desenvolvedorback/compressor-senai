<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SENAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="https://proeducador.sp.senai.br/site/icons/logo-small.png" type="image/x-icon">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background-color: #ededed;
    }

    /* Layout principal em duas colunas */
    .login-container {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    /* Coluna Esquerda: 30% da tela */
    .form-section {
      width: 30vw;
      min-width: 380px;
      background-color: #ededed;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      z-index: 2;
    }

    /* Container do conteúdo da esquerda */
    .form-content-wrapper {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Card do Login */
    .form-card {
      background-color: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      width: 100%;
    }

    .form-header {
      margin-bottom: 20px;
    }

    .category-tag {
      color: #ff3b3b;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .form-title {
      font-size: 22px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 4px;
    }

    .form-subtitle {
      font-size: 12px;
      color: #666666;
    }

    /* Campos do Formulário */
    .form-group {
      margin-bottom: 14px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: #111111;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .forgot-link {
      font-size: 10.5px;
      color: #ff3b3b;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background-color: #f7f7f7;
      font-size: 12.5px;
      color: #333333;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input::placeholder {
      color: #a0a0a0;
    }

    input:focus {
      border-color: #ff3b3b;
      background-color: #ffffff;
    }

    /* Switch Toggle */
    .remember-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #ff3b3b;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .remember-text {
      font-size: 11px;
      color: #555555;
    }

    /* Botão */
    .submit-btn {
      width: 100%;
      padding: 13px;
      background-color: #ff3b3b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .submit-btn a {
      text-decoration: none;
    }

    .submit-btn:hover {
      background-color: #e52828;
    }

    /* Link para Cadastro */
    .signup-link {
      text-align: center;
      margin-top: 14px;
      font-size: 11.5px;
      color: #555555;
    }

    .signup-link a {
      color: #ff3b3b;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    /* Rodapé fora da caixa */
    .form-footer {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: #888888;
      padding: 0 5px;
    }

    .form-footer strong {
      color: #333333;
    }

    .form-footer a {
      color: #888888;
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    /* Coluna Direita: Ocupa 70% da tela com a URL da foto fornecida */
    .image-section {
      width: 70vw;
      flex: 1;
      background-image: url('https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmbjxRFf1UqVGAorzbcncs7SMjZa7bxUlzl0D5HmfoERkgvKNYrSSTHggbchw13-8A0xwcSsTFRf_Ju6CfC4kX5XX2_V2jfKcUgWI6zyRPznSgo2YV8F4wLYChZR3G5t_bjis7c=s0');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }

    /* Responsividade */
    @media (max-width: 900px) {
      .image-section {
        display: none;
      }
      .form-section {
        width: 100%;
        max-width: 450px;
        margin: 0 auto;
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <main class="form-section">
      <div class="form-content-wrapper">
        <div class="form-card">
          <header class="form-header">
            <span class="category-tag">LOGIN</span>
            <h1 class="form-title">Entre na sua conta</h1>
            <p class="form-subtitle">Use seu e-mail e senha do SENAI</p>
          </header>

          <form>
            <div class="form-group">
              <label for="email">E-MAIL</label>
              <input type="email" id="email" placeholder="operador@senai.br" required>
            </div>

            <div class="form-group">
              <div class="label-row">
                <label for="senha">SENHA</label>
                <a href=".\recuperar-senha.html" class="forgot-link">Esqueceu a senha?</a>
              </div>
              <input type="password" id="senha" placeholder="••••••••••••" required>
            </div>

            <div class="remember-group">
              <label class="switch">
                <input type="checkbox" id="remember">
                <span class="slider"></span>
              </label>
              <span class="remember-text">Lembrar de mim</span>
            </div>

            <a href=".\dashboard.html" class="submit-btn">Entrar</a>
            
          </form>

          <p class="signup-link">
            Não possui uma conta? <a href=".\cadastro.html">Cadastrar</a>
          </p>
        </div>

        <footer class="form-footer">
          <span>Suporte Técnico: <strong>(14) 99999-9999</strong></span>
          <a href=".\termos.html">Termos de Uso</a>
        </footer>
      </div>
    </main>

    <aside class="image-section" aria-label="Imagem da Unidade SENAI"></aside>

  </div>

</body>
</html>
